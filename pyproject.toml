[project]
name = "odroid-h4-fan-control"
version = "1.0.0"
description = "ODROID H4 fan control script"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p faulthandler: dumps stack traces on hang/timeout at the C level so a
# regression fails visibly instead of blocking the suite forever.
addopts = "-q -p faulthandler"
filterwarnings = [
    # pytest-asyncio (installed globally, unused here) warns about an unset
    # option; silence the noise so stderr stays clean.
    "ignore::pytest.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py38"